name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: dlkp
        name: Download Keepass
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://keepass.info/download.html").Content
          $pattern = 'https://sourceforge\.net/projects/keepass/files/KeePass%202\.x/([\d.]+)/KeePass-([\d.]+)\.zip/download'
          $download = [regex]::Match($page, $pattern)
          if (!$download.Success -or $download.Groups[1].Value -ne $download.Groups[2].Value) {
            throw "Unable to determine the latest KeePass portable version"
          }
          $version = $download.Groups[1].Value
          $filename = "KeePass-$version.zip"
          curl.exe -L --fail --retry 3 -o $filename $download.Value
          if ($LASTEXITCODE -ne 0) { throw "Unable to download KeePass $version" }
          "filename=$filename" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Extract KeePass and Build
        shell: pwsh
        run: |
          mkdir build
          7z x -o"build" ${{ steps.dlkp.outputs.filename }} KeePass.exe
          $tag = "${{ github.ref_name }}"
          $ainfo = "KeePassNatMsg\Properties\AssemblyInfo.cs"
          $content = (Get-Content -Path $ainfo) -replace '\[assembly: AssemblyVersion\("([\d.]+?)"\)\]', ('[assembly: AssemblyVersion("' + $tag.substring(1) + '")]')
          $content | Set-Content -Path $ainfo
          nuget restore KeePassNatMsg.sln
          msbuild /p:Configuration=Release
      - name: Prepare Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          cp -Recurse KeePassNatMsg\bin\Release\ build\
          mv build\Release build\KeePassNatMsg
          $zip = "KeePassNatMsg-$tag-binaries.zip"
          7z a $zip .\build\KeePassNatMsg\ "-xr!*.pdb"
          $hash = (Get-FileHash "$zip" sha256).Hash.ToLower()
          Set-Content -Path 'release.txt' -Value ('### SHA256 Hash',('* '+$zip),('  * '+$hash))
          git clean -fx KeePassNatMsg
          $p = Start-Process -FilePath ".\build\KeePass.exe" -ArgumentList "--plgx-create","$pwd\KeePassNatMsg" -PassThru
          $p.WaitForExit()
          $plgx = 'KeePassNatMsg.plgx'
          $hash = (Get-FileHash "$plgx" sha256).Hash.ToLower()
          Add-Content -Path 'release.txt' -Value (('* '+$plgx),('  * '+$hash))
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release.txt
          files: |
            KeePassNatMsg-${{ github.ref_name }}-binaries.zip
            KeePassNatMsg.plgx
