name: Main workflow

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, reopened, review_requested]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: dlkp
        name: Download Keepass
        shell: pwsh
        run: |
          $version = "2.61.1"
          $filename = "KeePass-$version.zip"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$version/$filename"
          curl.exe -L --fail --retry 3 -o $filename $url
          if ($LASTEXITCODE -ne 0) { throw "Unable to download KeePass $version" }
          "filename=$filename" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Extract KeePass and Build
        shell: pwsh
        run: |
          mkdir build
          7z x -o"build" ${{ steps.dlkp.outputs.filename }} KeePass.exe
          nuget restore KeePassNatMsg.sln
          msbuild /p:Configuration=Release
